<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Feedback</title>
    <link rel="stylesheet" href="../Login & Dashboard/styles.css">
</head>
<body class="page-center">
    <div class="card">
        <h1>Employee Feedback</h1>
        <p>Do you have time to provide feedback questions about your work experience?</p>

        <div class="buttons" id="buttons">
            <button class="yes-btn" onclick="answerYes()">Yes</button>
            <button class="no-btn" onclick="answerNo()">No</button>
        </div>

        <div class="message" id="message"></div>
    </div>

    <script>
        function answerYes() {
            document.getElementById("buttons").style.display = "none";
            var msg = document.getElementById("message");
            msg.style.display = "block";
            msg.textContent = "Great! Redirecting you to the survey...";
            setTimeout(function() {
                window.location.href = "/project/company-happenings.html";
            }, 1500);
        }

        function answerNo() {
            document.getElementById("buttons").style.display = "none";
            var msg = document.getElementById("message");
            msg.style.display = "block";
            msg.textContent = "You can come back to this page to take the survey later by clicking 'Company Happenings'. Redirecting you to the home page...";
            setTimeout(function() {
                window.location.href = "/home";
            }, 2500);
        }
    </script>
</body>
</html>
