<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #D3D3D3;
            display: flex;
            height: 100vh;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        .container {
            background: #035272;
            color: #FF9B51;
            padding: 50px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 600px;
            width: 90%;
        }

        h1 {
            margin-top: 0;
            font-size: 36px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            color: white;
        }

        .checkmark {
            font-size: 64px;
            margin-bottom: 20px;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            background: #FF9B51;
            color: white;
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        a:hover {
            opacity: 0.85;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="checkmark">&#10003;</div>
        <h1>Thank You!</h1>
        <p>You have completed the Company Happenings check-in.</p>
        <p>Your responses have been recorded. We appreciate your time and feedback!</p>
        <a href="/home">Return to Home</a>
    </div>
</body>
</html>
